services:
  - type: web
    name: vestigio-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /graphql?query=%7B__typename%7D
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CHECKIN_RADIUS_M
        value: "150"
