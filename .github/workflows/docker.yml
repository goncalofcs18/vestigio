name: Docker

on:
  push:
    branches: [main]
    paths: [api/**, .github/workflows/docker.yml]
  workflow_dispatch:

# Publica a imagem da API no GitHub Container Registry (ghcr.io/<utilizador>/vestigio-api).
jobs:
  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vestigio-api:latest
            ghcr.io/${{ github.repository_owner }}/vestigio-api:${{ github.sha }}
